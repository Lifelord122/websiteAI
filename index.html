<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let gameOver = false;
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        document.addEventListener("keydown", (event) => {
            let next = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };
            switch (event.key) {
                case "ArrowUp":
                    next = { x: 0, y: -1 };
                    if (next.x === -direction.x && next.y === -direction.y) break;
                    direction = { x: 0, y: -1 };
                    break;
                case "ArrowDown":
                    next = { x: 0, y: 1 };
                    if (next.x === -direction.x && next.y === -direction.y) break;
                        direction = { x: 0, y: 1 };
                    break;
                case "ArrowLeft":
                    next = { x: -1, y: 0 };
                    if (next.x === -direction.x && next.y === -direction.y) break;
                        direction = { x: -1, y: 0 };
                    break;
                case "ArrowRight":
                    next = { x: 1, y: 0 };
                    if (next.x === -direction.x && next.y === -direction.y) break;
                        direction = { x: 1, y: 0 };
                    break;
            }
        });

        document.addEventListener("keydown", (event) => {
                    if (gameOver &&event.code === "Space") {
                        gameOver = false;
                        snake = [
                            { x: 10, y: 10 },
                            { x: 9, y: 10 },
                            { x: 8, y: 10 }
                        ];
                        direction = { x: 1, y: 0 };
                        score = 0;
                        document.getElementById("info").innerText =
                            `Score: ${score}`;
                    }});

        const moveSnake = () => {
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            if (head.x < 0 || head.x >= tileCount ||
                head.y < 0 || head.y >= tileCount ||
                snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver = true;
                alert("Game Over! Your score: " + score);
                return;
            }

            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score++;
                document.getElementById("info").innerText =
                    `Score: ${score}`;
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } else {
                snake.pop();
            }
        };

        drawGame();

        setInterval(() => {
            if (!gameOver) {
            moveSnake();
            }
            drawGame();
        }, 200);

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        // Step 2: Keyboard controls (arrow keys)
        // Step 3: Eating and growing
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================

    </script>

</body>
</html>
